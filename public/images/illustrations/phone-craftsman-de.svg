"400" fill="#334155" text-anchor="start">Wasser abgestellt. Bitte schnellstmöglich</text><text x="184" y="332" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="start">zurückrufen.</text><rect x="166" y="379" width="368" height="146" rx="20" fill="#ffffff" /><rect x="184" y="395" width="22" height="22" rx="6" fill="#2563eb"/><text x="216" y="412" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#64748b" text-anchor="start">Aibooking</text><rect x="422.32" y="391" width="71.68" height="29" rx="14.5" fill="#dbeafe"/><text x="436.32" y="407" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2563eb" text-anchor="start">Termin</text><text x="184" y="443" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start">Besichtigung Dienstag 8:00 Uhr</text><text x="184" y="471" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="start">Neues Bad, Hauptstraße 4. Fotos per</text><text x="184" y="492" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="start">E-Mail geschickt.</text><rect x="166" y="539" width="368" height="146" rx="20" fill="#ffffff" /><rect x="184" y="555" width="22" height="22" rx="6" fill="#2563eb"/><text x="216" y="572" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#64748b" text-anchor="start">Aibooking</text><rect x="400.48" y="551" width="93.52000000000001" height="29" rx="14.5" fill="#dbeafe"/><text x="414.48" y="567" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2563eb" text-anchor="start">Nachricht</text><text x="184" y="603" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start">Angebot für Wärmepumpe gewünscht</text><text x="184" y="631" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="start">Haus mit 140 m², Rückruf bitte nach 16</text><text x="184" y="652" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="start">Uhr.</text><g filter="url(#sh)"><rect x="660" y="200" width="440" height="320" rx="24" fill="#ffffff"/></g><text x="696" y="260" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start">Die KI hat gefragt nach:</text><circle cx="712" cy="313" r="16" fill="#dcfce7"/><path d="M704 313 l6 6 l11 -12" stroke="#15803d" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="744" y="320" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#334155" text-anchor="start">Den Auftrag</text><circle cx="712" cy="375" r="16" fill="#dcfce7"/><path d="M704 375 l6 6 l11 -12" stroke="#15803d" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="744" y="382" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#334155" text-anchor="start">Die Adresse</text><circle cx="712" cy="437" r="16" fill="#dcfce7"/><path d="M704 437 l6 6 l11 -12" stroke="#15803d" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="744" y="444" font-family="Inter, -